version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: student_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_db      х
    ports:
      - "5433:5432" # Прокидываем порт из контейнера компьютер
    restart: unless-stopped